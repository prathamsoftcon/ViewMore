        let sessionDisplayFields = null;
        const SESSION_DISPLAY_ORDER = [
            'ttttt_content_desc',
            'module',
            'ttttt_session_week',
            'ttttt_session_day',
            'ttttt_session_dt',
            'ttttt_session_no'
        ];
		//const APIPath= "http://p9:5858/api"

        function normalizeContentTypeVisibility(value) {
            if (!value) {
                return null;
            }

            if (typeof value === 'string') {
                const result = {};
                value.split(',').forEach(part => {
                    const cleaned = String(part || '').trim();
                    if (!cleaned) {
                        return;
                    }
                    const pieces = cleaned.split('=');
                    const key = String(pieces[0] || '').trim().toLowerCase();
                    const rawValue = String(pieces[1] || '').trim().toLowerCase();
                    if (!key) {
                        return;
                    }
                    result[key] = rawValue !== '0' && rawValue !== 'false' && rawValue !== 'no';
                });
                return Object.keys(result).length ? result : null;
            }

            if (typeof value === 'object') {
                const result = {};
                Object.keys(value).forEach(key => {
                    const normalizedKey = String(key || '').trim().toLowerCase();
                    if (!normalizedKey) {
                        return;
                    }
                    const rawValue = value[key];
                    result[normalizedKey] = rawValue === true || rawValue === 1 || String(rawValue).toLowerCase() === 'true';
                });
                return Object.keys(result).length ? result : null;
            }

            return null;
        }

        function normalizeSessionDisplayFields(value) {
            if (!value || typeof value !== 'object') {
                return null;
            }

            const normalized = {};
            Object.keys(value).forEach(key => {
                const fieldKey = String(key || '').trim();
                if (!fieldKey) {
                    return;
                }
                const config = value[key] || {};
                normalized[fieldKey] = {
                    label: String(config.label || '').trim(),
                    required: config.required === true
                };
            });

            return Object.keys(normalized).length ? normalized : null;
        }

        function getSessionFieldValue(group, field) {
            switch (field) {
                case 'ttttt_content_desc':
                    return String(group.content_desc || group.title || '').trim();
                case 'module':
                    return String(group.module || '').trim();
                case 'ttttt_session_week':
                    return String(group.session_week || '').trim();
                case 'ttttt_session_day':
                    return String(group.session_day || '').trim();
                case 'ttttt_session_dt':
                    return String(group.session_dt || '').trim();
                case 'ttttt_session_no':
                    return String(group.session_no || '').trim();
                default:
                    return '';
            }
        }

        function buildSessionDisplayText(group) {
            if (!sessionDisplayFields) {
                return group.title || '';
            }

            const parts = [];
            SESSION_DISPLAY_ORDER.forEach(field => {
                const config = sessionDisplayFields[field];
                if (!config || !config.required) {
                    return;
                }

                const value = getSessionFieldValue(group, field);
                if (!value) {
                    if (config.label) {
                        parts.push(config.label + ': NA');
                    }
                    return;
                }

                if (config.label) {
                    parts.push(config.label + ': ' + value);
                } else {
                    parts.push(value);
                }
            });

            return parts.length ? parts.join(' | ') : (group.title || '');
        }

        function isContentTypeAllowed(type) {
            if (String(type || '').trim().toLowerCase() === 'view') {
                return false;
            }

            if (!contentTypeVisibility) {
                return true;
            }

            const normalizedType = String(type || '').trim().toLowerCase();
            let key = normalizedType;
            if (normalizedType === 'ppt') {
                key = 'ppt';
            } else if (normalizedType === 'video') {
                key = 'video';
            } else if (normalizedType === 'activity') {
                key = 'activity';
            } else if (normalizedType === 'pdf') {
                key = 'pdf';
            }

            if (!Object.prototype.hasOwnProperty.call(contentTypeVisibility, key)) {
                return true;
            }

            return !!contentTypeVisibility[key];
        }

        async function loadConfig() {
            try {
                const response = await fetch(CONFIG_JSON, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('Config JSON not found');
                }

                appConfig = await response.json();

                if (!appConfig || !appConfig.api || !appConfig.api.apiPath || !appConfig.api.baseUrl) {
                    throw new Error('Config JSON is missing api.apiPath or api.baseUrl');
                }

                APIPath = String(appConfig.api.apiPath).trim();
                redirectBaseUrl = String(appConfig.api.baseUrl).trim();
                publicApiPath = String(appConfig.api.publicApiPath || '/public-api').trim();
                ContentLoginApi.configure({
                    apiPath: APIPath,
                    publicApiPath: publicApiPath,
                    publicApiKey: appConfig.api.publicApiKey || '',
                    publicEndpoints: appConfig.api.publicEndpoints || [],
                    userInfoEndpoint: appConfig.api.userInfoEndpoint || '/UserInfo'
                });

                contentTypeVisibility = normalizeContentTypeVisibility(appConfig.contentTypeVisibility);
                sessionDisplayFields = normalizeSessionDisplayFields(appConfig.sessionDisplayFields);

                applyConfigToUi();
            } catch (error) {
                console.error('Configuration load failed. Using default API path.', error);
            }
        }

        function applyConfigToUi() {
            if (!appConfig) {
                return;
            }

            document.title = appConfig.pageTitle || document.title;

            const primaryLogo = document.getElementById('primaryLogo');
            const secondaryLogo = document.getElementById('secondaryLogo');
            const universityName = document.getElementById('universityName');
            const courseHeading = document.getElementById('product-list-heading');
            const footerText = document.getElementById('footerText');
            const trainingHeading = getTrainingHeadingFromUrl();

            if (primaryLogo && appConfig.header && appConfig.header.primaryLogoSrc) {
                primaryLogo.src = appConfig.header.primaryLogoSrc;
            }
            if (secondaryLogo && appConfig.header && appConfig.header.secondaryLogoSrc) {
                secondaryLogo.src = appConfig.header.secondaryLogoSrc;
            }

            if (appConfig.header && appConfig.header.logoTitle) {
                if (primaryLogo) {
                    primaryLogo.title = appConfig.header.logoTitle;
                    primaryLogo.alt = appConfig.header.logoTitle;
                }
                if (secondaryLogo) {
                    secondaryLogo.title = appConfig.header.logoTitle;
                    secondaryLogo.alt = appConfig.header.logoTitle;
                }
            }

            if (universityName && appConfig.header && appConfig.header.universityName) {
                universityName.textContent = appConfig.header.universityName;
            }
            if (courseHeading) {
                if (trainingHeading) {
                    courseHeading.textContent = trainingHeading;
                } else if (appConfig.header && appConfig.header.courseHeading1) {
                    courseHeading.textContent = appConfig.header.courseHeading1;
                }
            }
            if (footerText && appConfig.labels && appConfig.labels.footer) {
                footerText.textContent = appConfig.labels.footer;
            }
        }

        function getTrainingHeadingFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const trainingName = String(params.get('trainingname') || '').trim();
            const trainingCode = String(params.get('trainingcode') || '').trim();

            if (trainingName && trainingCode) {
                return  trainingName + ' - ' + trainingCode ;
            }
            if (trainingName) {
                return trainingName;
            }
            if (trainingCode) {
                return trainingCode;
            }

            return '';
        }

        function getOtpCacheValidDays() {
            const configuredDays = Number(appConfig && appConfig.otpService && appConfig.otpService.cacheValidDays);
            return Number.isFinite(configuredDays) && configuredDays >= 0
                ? configuredDays
                : DEFAULT_OTP_CACHE_VALID_DAYS;
        }

        function getOtpCache() {
            try {
                const raw = localStorage.getItem(OTP_CACHE_KEY);
                if (!raw) {
                    return null;
                }
                return JSON.parse(raw);
            } catch (error) {
                console.warn('Invalid OTP cache format. Clearing cache.', error);
                localStorage.removeItem(OTP_CACHE_KEY);
                return null;
            }
        }

        function unwrapIdentityPayload(payload) {
            return payload && (payload.result || payload.Result) ? (payload.result || payload.Result) : payload;
        }

        function getIdentityUserDetails(payload) {
            const userPayload = unwrapIdentityPayload(payload);
            return userPayload && (userPayload.userdetails || userPayload.userDetails || userPayload.UserDetails);
        }

        function getIdentityAgencyDetails(payload) {
            const userPayload = unwrapIdentityPayload(payload);
            return userPayload && (userPayload.agencydetail || userPayload.agencyDetail || userPayload.AgencyDetail);
        }

        function extractIdentityIds(payload) {
            const userPayload = unwrapIdentityPayload(payload);
            const userDetails = getIdentityUserDetails(payload);
            const agencyDetails = getIdentityAgencyDetails(payload);

            return {
                userid: String(
                    (userPayload && (userPayload.userid || userPayload.userId || userPayload.UserId))
                    || (userDetails && (userDetails.userid || userDetails.userId || userDetails.UserId))
                    || ''
                ),
                agencyid: String(
                    (userPayload && (userPayload.agencyid || userPayload.agencyId || userPayload.AgencyId))
                    || (agencyDetails && (agencyDetails.agencyid || agencyDetails.agencyId || agencyDetails.AgencyId))
                    || (userDetails && (userDetails.agencyid || userDetails.agencyId || userDetails.AgencyId))
                    || (userDetails && (userDetails.userid || userDetails.userId || userDetails.UserId))
                    || ''
                )
            };
        }

        function isOtpCacheValid(cache, mobileNumber) {
            if (getOtpCacheValidDays() === 0) {
                localStorage.removeItem(OTP_CACHE_KEY);
                return false;
            }

            if (!cache || !cache.mobileNumber || !cache.savedAt) {
                return false;
            }

            if (String(cache.mobileNumber) !== String(mobileNumber)) {
                return false;
            }

            const savedAt = new Date(cache.savedAt).getTime();
            if (Number.isNaN(savedAt)) {
                return false;
            }

            const maxAgeMs = getOtpCacheValidDays() * 24 * 60 * 60 * 1000;
            if (Date.now() - savedAt > maxAgeMs) {
                return false;
            }

            if (!cache.userid || !cache.agencyid) {
                const ids = extractIdentityIds(cache.response || cache.payload);
                cache.userid = cache.userid || ids.userid;
                cache.agencyid = cache.agencyid || ids.agencyid;

                if (cache.userid && cache.agencyid) {
                    localStorage.setItem(OTP_CACHE_KEY, JSON.stringify(cache));
                } else {
                    return false;
                }
            }

            return true;
        }

        function persistOtpCache(mobileNumber, cacheUserid, cacheAgencyid, payload) {
            if (getOtpCacheValidDays() === 0) {
                localStorage.removeItem(OTP_CACHE_KEY);
                return;
            }

            const ids = extractIdentityIds(payload);
            const cache = {
                mobileNumber: String(mobileNumber),
                userid: String(cacheUserid || ids.userid || ''),
                agencyid: String(cacheAgencyid || ids.agencyid || ''),
                payload: payload || null,
                response: payload || null,
                savedAt: new Date().toISOString()
            };
            localStorage.setItem(OTP_CACHE_KEY, JSON.stringify(cache));
        }

        function applyIdentityPayload(payload) {
            const userPayload = unwrapIdentityPayload(payload);
            const ids = extractIdentityIds(payload);
            if (userPayload) {
                userid = ids.userid || userid;
                agencyid = ids.agencyid || agencyid;

                if (userPayload.authToken || userPayload.AuthToken) {
                    try {
                        ContentLoginApi.storeAuthenticatedUser(payload);
                    } catch (error) {
                        console.warn('Unable to store authenticated user:', error);
                    }
                }
            }

            return !!(userid && agencyid);
        }

        function restoreAuthenticatedUserFromCache(cache) {
            if (!cache) {
                return false;
            }

            if (ContentLoginApi.getAccessToken()) {
                return true;
            }

            const cachedPayload = cache.response || cache.payload;
            if (cachedPayload && ContentLoginApi.hasAuthToken(cachedPayload)) {
                try {
                    ContentLoginApi.storeAuthenticatedUser(cachedPayload);
                    return true;
                } catch (error) {
                    console.warn('Unable to restore authenticated user from cache:', error);
                }
            }

            return !!ContentLoginApi.getAccessToken();
        }

        function findReusableOtpCache() {
            if (getOtpCacheValidDays() === 0) {
                localStorage.removeItem(OTP_CACHE_KEY);
                return null;
            }

            const cached = getOtpCache();
            if (!cached || !cached.mobileNumber) {
                return null;
            }

            return isOtpCacheValid(cached, cached.mobileNumber) ? cached : null;
        }

        function tryUseCachedLogin() {
            const cached = findReusableOtpCache();
            if (!cached) {
                return false;
            }

            userid = cached.userid;
            agencyid = cached.agencyid;
            if (!restoreAuthenticatedUserFromCache(cached)) {
                return false;
            }

            localStorage.setItem('participant_userid', agencyid);
            console.log('Using cached content access for mobile number:', cached.mobileNumber);
            return true;
        }

        async function bootstrapIdentityFromMobile(mobileNumber, authPayload) {
            if (applyIdentityPayload(authPayload)) {
                return { status: 200, data: authPayload };
            }

            const response = await ContentLoginApi.getUserInfo(mobileNumber);
            applyIdentityPayload(response && response.data);
            return response;
        }

        function setPageLoading(isLoading) {
            const pageLoader = document.getElementById('pageLoader');
            document.body.classList.toggle('content-loading', isLoading);
            if (pageLoader) {
                pageLoader.style.display = isLoading ? 'flex' : 'none';

        async function initPage() {
            setPageLoading(true);
            try {
                await loadConfig();
                CHECK_MOBILE_ON_LOAD();
                await renderContentForSelectedTraining();
            } catch (error) {
                console.error('Page initialization failed:', error);
            } finally {
                setPageLoading(false);
            }
        }

        function getDynamicContentCacheKey(trainingId) {
            const normalizedTrainingId = String(trainingId || '').trim();
            return normalizedTrainingId
                ? ('content_items_dynamic_' + normalizedTrainingId)
                : 'content_items_dynamic_default';
        }

        function readDynamicContentCache(trainingId) {
            try {
                const cacheKey = getDynamicContentCacheKey(trainingId);
                let raw = localStorage.getItem(cacheKey);
                if (!raw) {
                    raw = localStorage.getItem('content_items_dynamic');
                }
                if (!raw) {
                    return null;
                }

                const parsed = JSON.parse(raw);
                if (!Array.isArray(parsed) || parsed.length === 0) {
                    return null;
                }

                const targetCacheKey = getDynamicContentCacheKey(trainingId);
                if (!localStorage.getItem(targetCacheKey)) {
                    localStorage.setItem(targetCacheKey, JSON.stringify(parsed));
                }

                return parsed;
            } catch (error) {
                console.warn('Invalid content_items_dynamic cache.', error);
                return null;
            }
        }

        function renderContentFromDynamicCache(trainingId) {
            const cachedRows = readDynamicContentCache(trainingId);
            if (!cachedRows) {
                return false;
            }

            const groups = mapRowsToRenderGroups(cachedRows);
            if (!groups.length) {
                return false;
            }

            renderGroups(groups);
            return true;
        }

        function renderContentForSelectedTraining() {
            const activeTrainingId = String(currentTrainingId || '').trim();
            const hasRenderedFromCache = renderContentFromDynamicCache(activeTrainingId);

            if (currentTrainingId) {
                return renderContentFromApis(currentTrainingId)
                    .catch(error => {
                        console.error('Failed to bind dynamic content for selected training:', error);
                        if (!hasRenderedFromCache) {
                            const productList = document.querySelector('.product-list');
                            if (productList) {
                                productList.innerHTML = '';
                            }
                        }
                    });
            }

            if (!hasRenderedFromCache) {
                const productList = document.querySelector('.product-list');
                if (productList) {
                    productList.innerHTML = '';
                }
            }

            return Promise.resolve();
        }

        function getApiArray(payload) {
            if (Array.isArray(payload)) {
                return payload;
            }

            if (payload && Array.isArray(payload.items)) {
                return payload.items;
            }

            if (payload && Array.isArray(payload.data)) {
                return payload.data;
            }

            if (payload && payload.result && Array.isArray(payload.result.items)) {
                return payload.result.items;
            }

            if (payload && payload.result && Array.isArray(payload.result.data)) {
                return payload.result.data;
            }

            return [];
        }

        function isOpenStatus(value) {
            if (value == null || value === '') {
                return true;
            }
            const normalized = String(value == null ? '' : value).trim().toLowerCase();
            return normalized === '0' || normalized === '1' || normalized === 'open' || normalized === 'active';
        }

        function getFieldValue(row, keys) {
            if (!row || !Array.isArray(keys)) {
                return '';
            }

            for (let i = 0; i < keys.length; i++) {
                const key = keys[i];
                if (Object.prototype.hasOwnProperty.call(row, key) && row[key] != null && row[key] !== '') {
                    return row[key];
                }
            }

            return '';
        }

        function getFileTypeFromPath(filePath) {
            if (!filePath) {
                return 'unknown';
            }

            const cleanPath = String(filePath).split('?')[0].split('#')[0];
            const fileName = cleanPath.split('/').pop().split('\\').pop();
            const ext = (fileName.split('.').pop() || '').toLowerCase();

            if (['mp4', 'mov', 'wmv', 'avi', 'mkv', 'flv', 'webm', 'm3u8'].includes(ext)) {
                return 'video';
            }
            if (ext === 'pdf') {
                return 'pdf';
            }
            if (['ppt', 'pptx'].includes(ext)) {
                return 'ppt';
            }
            if (['html', 'htm'].includes(ext)) {
                return 'html';
            }

            return 'unknown';
        }

        function mapContentType(item) {
            const filePath = getFieldValue(item, ['globalWysiwagText', 'global_wysiwag_text', 'ttsad_file_path', 'file_path', 'filepath']);
            const fileType = getFileTypeFromPath(filePath || '');

            if (fileType === 'pdf') {
                return { type: 'pdf', redirection_path: 'litteraroompdf' };
            }
            if (fileType === 'ppt') {
                return { type: 'PPT', redirection_path: 'litteraroomppt' };
            }
            if (fileType === 'video') {
                return { type: 'Video', redirection_path: 'videolearning' };
            }
            if (fileType === 'html') {
                return { type: 'Activity', redirection_path: 'videolearning' };
            }

            return null;
        }

        function getContentSourcePath(item) {
            return String(getFieldValue(item, ['globalWysiwagText', 'global_wysiwag_text', 'ttsad_file_path', 'file_path', 'filepath']) || '').trim();
        }

        function getSessionSerial(row, fallbackIndex) {
            const sessionNo = Number(row && row.ttttt_session_no);
            if (!Number.isNaN(sessionNo) && sessionNo > 0) {
                return sessionNo;
            }

            const displayTxt = String(row.ttttt_content_desc || '');
            const match = displayTxt.match(/#\s*Sr\s*-\s*(\d+)/i);
            if (match && match[1]) {
                return Number(match[1]);
            }
            return fallbackIndex + 1;
        }

        function parseSortNumber(value, fallbackValue) {
            const num = Number(value);
            if (Number.isFinite(num)) {
                return num;
            }
            return fallbackValue;
        }

        function parseSessionDate(value) {
            if (value == null || value === '') {
                return Number.MAX_SAFE_INTEGER;
            }
            const numeric = Number(value);
            if (Number.isFinite(numeric)) {
                return numeric;
            }
            const date = new Date(value);
            if (!Number.isNaN(date.getTime())) {
                return date.getTime();
            }
            return Number.MAX_SAFE_INTEGER;
        }

        function compareSessionOrder(a, b) {
            const moduleA = parseSortNumber(a.module, Number.MAX_SAFE_INTEGER);
            const moduleB = parseSortNumber(b.module, Number.MAX_SAFE_INTEGER);
            if (moduleA !== moduleB) {
                return moduleA - moduleB;
            }

            const weekA = parseSortNumber(a.session_week, Number.MAX_SAFE_INTEGER);
            const weekB = parseSortNumber(b.session_week, Number.MAX_SAFE_INTEGER);
            if (weekA !== weekB) {
                return weekA - weekB;
            }

            const dayA = parseSortNumber(a.session_day, Number.MAX_SAFE_INTEGER);
            const dayB = parseSortNumber(b.session_day, Number.MAX_SAFE_INTEGER);
            if (dayA !== dayB) {
                return dayA - dayB;
            }

            const dateA = parseSessionDate(a.session_dt);
            const dateB = parseSessionDate(b.session_dt);
            if (dateA !== dateB) {
                return dateA - dateB;
            }

            const sessionNoA = parseSortNumber(a.session_no, Number.MAX_SAFE_INTEGER);
            const sessionNoB = parseSortNumber(b.session_no, Number.MAX_SAFE_INTEGER);
            if (sessionNoA !== sessionNoB) {
                return sessionNoA - sessionNoB;
            }

            return 0;
        }

        async function fetchTrainingApiRows(endpointCandidates, trainingId) {
            const encodedTrainingId = encodeURIComponent(trainingId);
            let lastError = null;

            for (let i = 0; i < endpointCandidates.length; i++) {
                const endpoint = endpointCandidates[i];
                const usePublicPath = endpoint === 'trgsessions' || endpoint === 'trgsession';
                const apiBase = usePublicPath ? publicApiPath : APIPath;
                const apiUrl = apiBase + '/' + endpoint + '?trainingid=' + encodedTrainingId;

                try {
                    const response = await axios.get(apiUrl, {
                        headers: usePublicPath ? ContentLoginApi.getPublicHeaders() : ContentLoginApi.getAuthHeaders()
                    });
                    return getApiArray(response.data);
                } catch (error) {
                    lastError = error;
                }
            }

            throw lastError || new Error('Failed to load training API data');
        }

        async function buildGroupedContentJson(trainingId) {
            const sessionRowsRaw = await fetchTrainingApiRows(['trgsessions', 'trgsession'], trainingId);
            const contentRowsRaw = await fetchTrainingApiRows(['trg_content'], trainingId);

            console.log('Session rows raw count:', Array.isArray(sessionRowsRaw) ? sessionRowsRaw.length : 0);
            console.log('Content rows raw count:', Array.isArray(contentRowsRaw) ? contentRowsRaw.length : 0);

            const sessionRows = sessionRowsRaw
                .filter(row => row && isOpenStatus(getFieldValue(row, ['ttttt_status', 'status', 'is_active'])))
                .map((row, index) => ({
                    sr_no: getSessionSerial(row, index),
                    content_desc: String(getFieldValue(row, ['ttttt_content_desc', 'title', 'ttttt_title']) || '').trim(),
                    title: String(getFieldValue(row, ['ttttt_content_desc', 'module', 'ttttt_content_desc', 'title', 'ttttt_title']) || '').trim(),
                    session_id: String(getFieldValue(row, ['ttttt_session_id', 'ttttt_id', 'session_id', 'id']) || '').trim(),
                    module: getFieldValue(row, ['module', 'ttttt_module', 'ttttt_session_module']),
                    session_week: getFieldValue(row, ['ttttt_session_week', 'session_week', 'week']),
                    session_day: getFieldValue(row, ['ttttt_session_day', 'session_day', 'day']),
                    session_dt: getFieldValue(row, ['ttttt_session_dt', 'session_dt', 'date']),
                    session_no: getFieldValue(row, ['ttttt_session_no', 'session_no'])
                }))
                .filter(row => row.title && row.session_id);

            const contentRows = contentRowsRaw
                .filter(row => row && isOpenStatus(getFieldValue(row, ['ttsad_status', 'status', 'is_active'])))
                .map(row => {
                    const mapped = mapContentType(row);
                    if (!mapped) {
                        return null;
                    }
                    return {
                        ttsam_id: String(getFieldValue(row, ['ttsam_id', 'id', 'ttsad_ttsam_id']) || '').trim(),
                        ttsam_ttttt_session_id: String(getFieldValue(row, ['ttsam_ttttt_session_id', 'ttttt_session_id', 'session_id', 'ttsad_ttttt_session_id']) || '').trim(),
                        type: mapped.type,
                        redirection_path: mapped.redirection_path,
                        content_path: getContentSourcePath(row)
                    };
                })
                .filter(row => row)
                .filter(row => isContentTypeAllowed(row.type))
                .filter(row => row.ttsam_id && row.ttsam_ttttt_session_id);

            console.log('Session rows after filter:', sessionRows.length);
            console.log('Content rows after filter:', contentRows.length);

            const contentBySession = {};
            contentRows.forEach(row => {
                if (!contentBySession[row.ttsam_ttttt_session_id]) {
                    contentBySession[row.ttsam_ttttt_session_id] = [];
                }
                contentBySession[row.ttsam_ttttt_session_id].push({
                    type: row.type,
                    ttsam_id: row.ttsam_id,
                    redirection_path: row.redirection_path,
                    content_path: row.content_path
                });
            });

            const grouped = sessionRows
                .map(row => ({
                    sr_no: row.sr_no,
                    title: row.title,
                    content_desc: row.content_desc,
                    children: contentBySession[row.session_id] || [],
                    module: row.module,
                    session_week: row.session_week,
                    session_day: row.session_day,
                    session_dt: row.session_dt,
                    session_no: row.session_no
                }))
                .filter(row => row.children.length > 0)
                .sort(compareSessionOrder);

            try {
                const cacheKey = getDynamicContentCacheKey(trainingId);
                localStorage.setItem(cacheKey, JSON.stringify(grouped));
            } catch (error) {
                console.warn('Unable to store generated content JSON in localStorage.', error);
            }

            console.log('Generated content_items_dynamic:', JSON.stringify(grouped, null, 2));

            return grouped;
        }

        function renderGroups(groups) {
            const productList = document.querySelector('.product-list');

            groups.forEach(group => {

        function mapRowsToRenderGroups(rows) {
            return rows
                .map(row => {
                    const srNo = Number(row.sr_no || row.srNo || 0);

                    const module = row.module || '';
                    const sessionWeek = row.session_week || row.sessionWeek || '';
                    const sessionDay = row.session_day || row.sessionDay || '';
                    const sessionDt = row.session_dt || row.sessionDt || '';
                    const sessionNo = row.session_no || row.sessionNo || '';
                    const contentDesc = row.content_desc || row.contentDesc || '';

                            .map(child => ({

            function s4() {
                return Math.floor((1 + Math.random()) * 0x10000)
                    .toString(16)

            return s4() + s4() + '-' + s4() + '-' + s4() + '-' + s4() + '-' + s4() + s4() + s4();
        }

        function getTrackingCurrentDateTime() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const MM = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');

            return yyyy + '-' + MM + '-' + dd + ' ' + hh + ':' + mm + ':' + ss;

        function openWindowWithAudit(targetUrl, eventName, recordId, contentId) {
            const redirectDelayMs = 1200;
            const openedWindow = window.open('about:blank', '_blank');
            const auditPromise = Promise.allSettled([
                saveViewMoreRedirectAudit(eventName, recordId),
                saveViewMoreLearningTime(contentId)
            ]);
            const timeoutPromise = new Promise(resolve => setTimeout(resolve, redirectDelayMs));

            Promise.race([auditPromise, timeoutPromise])
                .finally(function () {
                    if (openedWindow && !openedWindow.closed) {
                        openedWindow.location.replace(targetUrl);
                        return;

                    window.open(targetUrl, '_blank');
                });

        function buildContentLink(item) {
            const sourcePath = String(item.content_path || item.globalWysiwagText || item.global_wysiwag_text || item.ttsad_file_path || item.file_path || item.filepath || '').trim();
            const ttsamId = String(item.ttsam_id || '').trim();

            if (!ttsamId) {
                if (sourcePath) {
                    return DIRECT_LINK_PREFIX + sourcePath;
                }
                return '';

            if (!redirectPath) {
                if (sourcePath) {
                    return DIRECT_LINK_PREFIX + sourcePath;
                }
                return 'videolearning/' + ttsamId;

            if (redirectPath.indexOf('{ttsam_id}') !== -1) {
                return redirectPath.replace('{ttsam_id}', ttsamId);
            }

            if (redirectPath.endsWith('/')) {
                return redirectPath + ttsamId;
            }

            if (redirectPath.toLowerCase().endsWith(ttsamId.toLowerCase())) {
                return redirectPath;
            }

            return redirectPath + '/' + ttsamId;
        }

<script>
  const thumb = document.getElementById('sliderThumb');
  const track = document.getElementById('sliderTrack');
  const status = document.getElementById('captchaStatus');

  let isDragging = false;
  let startX = 0;

  function startDrag(x) {
  
    isDragging = true;
    startX = x - thumb.offsetLeft;
  }

  function moveThumb(x) {
    if (!isDragging) return;
    let newX = x - startX;
    const maxX = track.clientWidth - thumb.clientWidth;
    newX = Math.max(0, Math.min(newX, maxX));
    thumb.style.left = newX + 'px';
  }

  function stopDrag() {
    if (!isDragging) return;
    isDragging = false;
    const maxX = track.clientWidth - thumb.clientWidth;
    if (parseInt(thumb.style.left) >= maxX - 5) {
      status.textContent = 'Verified ✅';
	
      status.className = 'captcha-status success';
      thumb.style.backgroundColor = '#2ecc71';
      thumb.textContent = '✔';
	  Open_Video_Link_redirect()
    } else {
      thumb.style.left = '0px';
      status.textContent = 'Try again';
      status.className = 'captcha-status fail';
    }
  }

  // Mouse events
  thumb.addEventListener('mousedown', e => startDrag(e.clientX));
  document.addEventListener('mousemove', e => moveThumb(e.clientX));
  document.addEventListener('mouseup', stopDrag);

  // Touch events
  thumb.addEventListener('touchstart', e => startDrag(e.touches[0].clientX));
  sliderModal.addEventListener('touchmove', e => {
    moveThumb(e.touches[0].clientX);
    e.preventDefault(); // prevent scrolling
  }, { passive: false });
  sliderModal.addEventListener('touchend', stopDrag);
  
  
  function resetSlider() {
  thumb.style.left = '0px';
  thumb.style.backgroundColor = '#4CAF50';
  thumb.textContent = '▶';
  status.textContent = 'Slide to verify (स्लाइड करें )';
  status.className = 'captcha-status';

  isDragging = false;
}



document.getElementById('otp-1').addEventListener('paste', function(e) {
    e.preventDefault(); // Stop the default paste behavior
    const paste = (e.clipboardData || window.clipboardData).getData('text').trim();
    const chars = paste.split('');

    for (let i = 0; i < 6; i++) {
        const input = document.getElementById(`otp-${i + 1}`);
        if (input) {
            input.value = chars[i] || ''; // Fill character if available, else empty
        }
    }

    // Optionally focus the next empty input
    for (let i = 0; i < 6; i++) {
        const input = document.getElementById(`otp-${i + 1}`);
        if (input.value === '') {
            input.focus();
            break;
        }
    }
});
</script>
