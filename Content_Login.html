function updateSelectedTrainingMeta(selectedTrainingId) {
    const ddl = document.getElementById('ddltraining');
    if (!ddl) {
        return;
    }

    if (selectedTrainingId) {
        ddl.value = selectedTrainingId;
    }

    const selectedOption = ddl.options[ddl.selectedIndex];
    if (!selectedOption || !selectedOption.value) {
        trainingCode = "";
        trainingName = "";
        return;
    }

    trainingid = selectedOption.value;
    trainingCode = String(selectedOption.getAttribute('data-training-code') || '').trim();
    trainingName = String(selectedOption.getAttribute('data-training-name') || '').trim();

    if (!trainingCode || !trainingName) {
        const optionText = String(selectedOption.textContent || '').trim();
        const separatorIndex = optionText.indexOf('-');

        if (separatorIndex > -1) {
            if (!trainingCode) {
                trainingCode = optionText.slice(0, separatorIndex).trim();
            }
            if (!trainingName) {
                trainingName = optionText.slice(separatorIndex + 1).trim();
            }
        } else if (!trainingName) {
            trainingName = optionText;
        }
    }
}

async function loadConfig() {
    try {
        appConfig = await ContentLoginApi.loadConfig(CONFIG_JSON);
        appMessages = Object.assign({}, appMessages, appConfig.messages || {});

        if (!appConfig.api || !appConfig.api.apiPath) {
            throw new Error('Config JSON is missing api.apiPath');
        }

        APIPath = appConfig.api.apiPath;
        ContentLoginApi.configure({
            apiPath: APIPath,
            publicApiPath: appConfig.api.publicApiPath || "/public-api",
            publicApiKey: appConfig.api.publicApiKey || "",
            publicEndpoints: appConfig.api.publicEndpoints || [],
            userInfoEndpoint: appConfig.api.userInfoEndpoint || "/UserInfo"
        });

        applyConfigToUi();
        initializeOtpService();
    } catch (error) {
        console.error('Configuration load failed:', error);
    }
}

function applyIdentityPayload(payload) {
    const userPayload = payload && (payload.result || payload.Result) ? (payload.result || payload.Result) : payload;
    const userDetails = userPayload && (userPayload.userdetails || userPayload.userDetails || userPayload.UserDetails);
    const agencyDetails = userPayload && (userPayload.agencydetail || userPayload.agencyDetail || userPayload.AgencyDetail);
    if (userPayload) {
        userid = String(
            userDetails && (userDetails.userid || userDetails.userId || userDetails.UserId)
                ? (userDetails.userid || userDetails.userId || userDetails.UserId)
                : userid
        );
        agencyid = String(
            agencyDetails && (agencyDetails.agencyid || agencyDetails.agencyId || agencyDetails.AgencyId)
                ? (agencyDetails.agencyid || agencyDetails.agencyId || agencyDetails.AgencyId)
                : agencyid
        );

        if (userPayload.authToken || userPayload.AuthToken) {
            try {
                ContentLoginApi.storeAuthenticatedUser(payload);
            } catch (error) {
                console.warn("Unable to store authenticated user:", error);
            }
        }
    }

    return !!(userid && agencyid);
}

async function bootstrapIdentityFromMobile(mobileNumber, authPayload) {
    if (applyIdentityPayload(authPayload)) {
        return { status: 200, data: authPayload };
    }

    const response = await ContentLoginApi.getUserInfo(mobileNumber);
    applyIdentityPayload(response && response.data);
    return response;
}

function getFileType(filePath) {
  if (!filePath) return null;

  // Decode encoded characters like %20, %5C, etc.
  const decoded = decodeURIComponent(filePath);
   // Remove query params (?v=1) and hash (#section)
  const cleanPath = decoded.split('?')[0].split('#')[0];

  // Extract filename safely (handles / and \)
  const fileName = cleanPath.split('/').pop().split('\\').pop();

//   // Extract filename or extension safely
//   const fileName = decoded.split('/').pop().split('\\').pop();

  // Get extension
  const ext = fileName.split('.').pop().toLowerCase();

  if (['html', 'htm'].includes(ext)) return 'html';
  if (ext === 'pdf') return 'pdf';
  if (['ppt', 'pptx'].includes(ext)) return 'ppt';
    if (['mp4', 'mov', 'wmv', 'avi', 'mkv', 'flv', 'webm', 'm3u8'].includes(ext)) return 'video';

  return 'unknown';
}

<script>
    document.getElementById('otp-1').addEventListener('paste', function(e) {
    e.preventDefault(); // Stop the default paste behavior
    const paste = (e.clipboardData || window.clipboardData).getData('text').trim();
    const chars = paste.split('');

    for (let i = 0; i < 6; i++) {
        const input = document.getElementById(`otp-${i + 1}`);
        if (input) {
            input.value = chars[i] || ''; // Fill character if available, else empty
        }
    }

    // Optionally focus the next empty input
    for (let i = 0; i < 6; i++) {
        const input = document.getElementById(`otp-${i + 1}`);
        if (input.value === '') {
            input.focus();
            break;
        }
    }
});

function startResendOtpTimer() {
    const resendLink = document.getElementById("resend-link");
    const timerText = document.getElementById("timer");

    resendLink.hidden = true;
    timerText.hidden = false;

    // Disable link
    // resendLink.style.pointerEvents = "none";
    // resendLink.style.opacity = "0.5";

    let timeLeft = 60;

    timerText.textContent = ` (Wait ${timeLeft}s)`;

    const countdown = setInterval(() => {
        timeLeft--;
        timerText.textContent = ` (Wait ${timeLeft}s)`;

        if (timeLeft <= 0) {
            clearInterval(countdown);

            // Enable link
            // resendLink.style.pointerEvents = "auto";
            // resendLink.style.opacity = "1";
            // timerText.textContent = "";
            resendLink.hidden = false;
            timerText.hidden = true;
        }
    }, 1000);
}

function guid() {
    function s4() {
        return Math.floor((1 + Math.random()) * 0x10000)
            .toString(16)
            .substring(1);
    }
    return s4() + s4() + '-' + s4() + '-' + s4() + '-' +
        s4() + '-' + s4() + s4() + s4();
}
function getCurrentDateTime() {
  const now = new Date();

  const yyyy = now.getFullYear();
  const MM = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");

  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");

  return `${yyyy}-${MM}-${dd} ${hh}:${mm}:${ss}`;
}
